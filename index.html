<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme')
        document.querySelector('meta[name="color-scheme"]').content = storedScheme ?? 'light dark'
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Roast & Redline (Cars & Coffee) — Discover 100+ weekend coffee runs, casual car meets, live cruising weather, and community car spotting across Melbourne & Malaysia."
    />
    <meta name="theme-color" content="#11100E" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>Roast &amp; Redline — Cars &amp; Coffee Community Meets &amp; Social Spotting</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
